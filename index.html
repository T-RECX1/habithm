

## Single-file HTML implementation  
```html
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>⬛︎</title>
<style>
  *{box-sizing:border-box}
  :root{
    --accent:hsl(200 100% 55%);
    --bg:#05050a;
    --ink:#f7f7ff;
    --ease:cubic-bezier(.2,.85,.2,1);
  }
  html,body{height:100%;width:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }

  /* Grid = squares only */
  #grid{
    height:100%;width:100%;
    display:grid;place-content:center;
    grid-template-columns:repeat(auto-fit,minmax(72px,72px));
    gap:16px;padding:24px;
  }
  .tile{
    width:72px;height:72px;border:0;padding:0;background:transparent;
    border-radius:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform .15s var(--ease);transform:translateZ(0);
  }
  .tile:active{transform:scale(.96)}
  .tile svg{width:100%;height:100%;display:block}
  .sq__border{
    fill:none;stroke:var(--c);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.92
  }
  .sq__fill{
    fill:var(--c);opacity:0;transform-origin:50% 50%;transform:scale(.72);
    transition:opacity .45s var(--ease),transform .6s var(--ease);
  }
  .is-done .sq__fill{opacity:.95;transform:scale(1)}
  .tile:not(.is-done) .sq__border{
    stroke-dasharray:260;stroke-dashoffset:260;animation:draw .9s var(--ease) forwards
  }
  @keyframes draw{to{stroke-dashoffset:0}}

  /* Easter egg: prism mode makes completed squares subtly breathe (still squares only) */
  body.egg-prism .tile.is-done{animation:donePulse 2.1s ease-in-out infinite}
  @keyframes donePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

  /* Overlay (level view) */
  #overlay[hidden]{display:none}
  #overlay{
    position:fixed;inset:0;overflow:hidden;background:#040408;
  }
  #overlay::before{
    content:"";position:absolute;inset:-40%;
    background:conic-gradient(from 90deg,
      rgba(255,255,255,0) 0 18%,
      rgba(255,255,255,.22) 26%,
      rgba(255,255,255,0) 35%,
      rgba(255,255,255,.16) 62%,
      rgba(255,255,255,0) 72% 100%);
    opacity:.28;filter:blur(30px);animation:bgSpin 16s linear infinite;
    mix-blend-mode:overlay;pointer-events:none;
  }
  #overlay::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.025),rgba(255,255,255,.025) 1px,transparent 1px,transparent 3px);
    opacity:.16;mix-blend-mode:overlay;pointer-events:none;
  }
  @keyframes bgSpin{to{transform:rotate(360deg)}}

  #overlayInner{
    position:relative;height:100%;width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:16px;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  }
  #back,#hint,#core{border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #back,#hint{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);
    width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  }
  #back{left:10px}
  #hint{right:10px}
  #back::before{
    content:"";width:16px;height:16px;border-left:4px solid var(--accent);border-bottom:4px solid var(--accent);
    transform:rotate(45deg) translateX(2px);opacity:.95
  }
  #hintDots{display:flex;gap:5px}
  .hd{width:7px;height:7px;border-radius:99px;border:2px solid var(--accent);opacity:.9}
  .hd.used{opacity:.25}

  #core{
    width:min(44vw,190px);aspect-ratio:1;border-radius:28px;
    display:grid;place-items:center;transition:transform .15s var(--ease);
  }
  #core:active{transform:scale(.985)}
  #core svg{width:100%;height:100%;display:block}

  #scene{
    flex:1 1 auto;width:min(94vw,560px);height:min(64vh,560px);
    border-radius:26px;position:relative;overflow:hidden;
    background:rgba(255,255,255,.03);
    box-shadow:0 18px 60px rgba(0,0,0,.45) inset,0 30px 80px rgba(0,0,0,.35);
  }
  #scene::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(900px circle at 12% 10%, rgba(255,255,255,.08), transparent 55%),
      radial-gradient(900px circle at 90% 88%, rgba(255,255,255,.06), transparent 52%);
    opacity:.9;pointer-events:none;
  }

  .toast{
    position:absolute;left:50%;transform:translateX(-50%) translateY(8px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    padding:10px 14px;border-radius:999px;
    background:rgba(0,0,0,.72);color:#fff;font-size:14px;letter-spacing:.2px;
    opacity:0;pointer-events:none;
    transition:opacity .2s var(--ease),transform .2s var(--ease);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .confetti{
    position:absolute;left:50%;top:50%;
    width:8px;height:8px;border-radius:3px;
    background:var(--accent);transform:translate(-50%,-50%);
    opacity:.95;pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .tile,#core{transition-duration:.01ms}
    body.egg-prism .tile.is-done{animation:none}
    #overlay::before{animation-duration:26s}
  }
</style>
</head>
<body>
  <div id="grid" aria-label="levels"></div>

  <div id="overlay" hidden aria-hidden="true">
    <div id="overlayInner">
      <button id="back" aria-label="back"></button>
      <button id="hint" aria-label="hint"><span id="hintDots"></span></button>

      <!-- Core square is the only consistent interaction target (tap when a level “wants” it). -->
      <button id="core" aria-label="core"></button>

      <div id="scene" aria-hidden="true"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const N = 30;
  const KEY = 'meta_squares_save_v1';

  const $ = (id) => document.getElementById(id);
  const grid = $('grid');
  const overlay = $('overlay');
  const overlayInner = $('overlayInner');
  const backBtn = $('back');
  const hintBtn = $('hint');
  const hintDots = $('hintDots');
  const coreBtn = $('core');
  const sceneEl = $('scene');
  const toastEl = $('toast');

  const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
  const rand = (a,b)=>a+Math.random()*(b-a);
  const mm = (q)=>{ try{return window.matchMedia(q)}catch{return {matches:false,addEventListener(){},removeEventListener(){}}} };

  const COLORS = [
    'hsl(0 100% 55%)','hsl(137.5 100% 55%)','hsl(275 100% 55%)','hsl(52.5 100% 55%)','hsl(190 100% 55%)',
    'hsl(327.5 100% 55%)','hsl(105 100% 55%)','hsl(242.6 100% 55%)','hsl(20.1 100% 55%)','hsl(157.6 100% 55%)',
    'hsl(295.1 100% 55%)','hsl(72.6 100% 55%)','hsl(210.1 100% 55%)','hsl(347.6 100% 55%)','hsl(125.1 100% 55%)',
    'hsl(262.6 100% 55%)','hsl(40.1 100% 55%)','hsl(177.6 100% 55%)','hsl(315.1 100% 55%)','hsl(92.7 100% 55%)',
    'hsl(230.2 100% 55%)','hsl(7.7 100% 55%)','hsl(145.2 100% 55%)','hsl(282.7 100% 55%)','hsl(60.2 100% 55%)',
    'hsl(197.7 100% 55%)','hsl(335.2 100% 55%)','hsl(112.7 100% 55%)','hsl(250.2 100% 55%)','hsl(27.7 100% 55%)'
  ];

  function squareSVG(){
    return `<svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="12" y="12" width="76" height="76" rx="18" ry="18" class="sq__fill"></rect>
      <rect x="12" y="12" width="76" height="76" rx="18" ry="18" class="sq__border"></rect>
    </svg>`;
  }

  function freshState(){ return { unlocked:[0], completed:{}, hintsLeft:3, hinted:{}, eggs:{} }; }
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return freshState();
      const s = JSON.parse(raw);
      if(!s || !Array.isArray(s.unlocked)) return freshState();
      s.completed = s.completed && typeof s.completed==='object' ? s.completed : {};
      s.hinted = s.hinted && typeof s.hinted==='object' ? s.hinted : {};
      s.eggs = s.eggs && typeof s.eggs==='object' ? s.eggs : {};
      s.hintsLeft = Number.isFinite(s.hintsLeft) ? clamp(s.hintsLeft,0,3) : 3;
      if(!s.unlocked.includes(0)) s.unlocked.unshift(0);
      return s;
    }catch{ return freshState(); }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch{} }

  let state = load();

  function setAccent(c){ document.documentElement.style.setProperty('--accent', c); }

  function updateHintUI(){
    hintDots.innerHTML='';
    for(let i=0;i<3;i++){
      const d=document.createElement('span');
      d.className='hd'+(i>=state.hintsLeft?' used':'');
      hintDots.appendChild(d);
    }
  }

  let toastT=0;
  function toast(msg){
    clearTimeout(toastT);
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    toastT=setTimeout(()=>toastEl.classList.remove('show'),1600);
  }

  function burst(ctx, n=18){
    for(let i=0;i<n;i++){
      const p=document.createElement('div');
      p.className='confetti'; sceneEl.appendChild(p);
      const ang=Math.random()*Math.PI*2, dist=rand(80,260);
      const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      const rot=rand(-240,240), s0=rand(.7,1.2), s1=rand(.35,1.0);
      const a=p.animate([
        {transform:`translate(-50%,-50%) translate(0,0) rotate(0deg) scale(${s0})`,opacity:1},
        {transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${s1})`,opacity:0}
      ],{duration:rand(650,1200),easing:'cubic-bezier(.15,.9,.2,1)',fill:'forwards'});
      ctx.anims.push(a);
      setTimeout(()=>p.remove(),1300);
    }
  }

  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

  function renderGrid(){
    clear(grid);
    const unlocked=[...new Set(state.unlocked)].filter(i=>i>=0&&i<N).sort((a,b)=>a-b);
    for(const idx of unlocked){
      const b=document.createElement('button');
      b.className='tile'+(state.completed[idx]?' is-done':'');
      b.style.setProperty('--c', COLORS[idx]);
      b.innerHTML=squareSVG();
      b.addEventListener('click', ()=>openLevel(idx), {passive:true});
      grid.appendChild(b);
    }
    document.body.classList.toggle('egg-prism', !!state.eggs.prism);
  }

  // Easter egg: rotate 4 times quickly on the grid toggles prism mode
  let egg={c:0,t:0};
  window.addEventListener('orientationchange', ()=>{
    if(active) return;
    const now=performance.now();
    if(now-egg.t>1400) egg.c=0;
    egg.t=now; egg.c++;
    if(egg.c>=4){
      egg.c=0;
      state.eggs.prism=!state.eggs.prism;
      save(); renderGrid();
    }
  }, {passive:true});

  // Level definitions (no names/labels; only color identity)
  const LEVELS = [
    {u:[1,2,3], k:'mql', q:'(orientation: landscape)', s:'horizon', h:['The horizon wants to widen.','Gravity prefers the long edge.','The square dreams sideways.']},
    {u:[4,5], k:'mql', q:'(orientation: portrait)',  s:'rain',    h:['The fall is vertical.','The long edge stands up.','Let the world become taller.']},
    {u:[6],     k:'flips',need:2,win:1100,            s:'pendulum',h:['One turn is not proof.','Make the world change its mind twice.','Back-and-forth settles the metronome.']},
    {u:[7],     k:'pinch',th:1.15,                    s:'tank',    h:['The liquid listens to distance between fingers.','Magnify the room.','Make the glass bigger than the world.']},
    {u:[8,9],   k:'keyboard',th:0.35,                 s:'cursor',  h:['A cursor is a door.','Summon the hidden panel.','The bottom of the screen can rise.']},
    {u:[10],    k:'fullscreen',                       s:'frame',   h:['The frame wants the whole stage.','Let it swallow the borders.','A single tap can expand a world.']},
    {u:[11,12], k:'mql', q:'(prefers-color-scheme: dark)', s:'eclipse', h:['The moon wins in the system.','Pick the darker palette upstream.','Let night bleed into the browser.']},
    {u:[13],    k:'mql', q:'(prefers-color-scheme: light)',s:'sun',     h:['The sun is the system’s default.','Return to the brighter palette.','Let day dominate the browser.']},
    {u:[14,15], k:'mql', q:'(prefers-reduced-motion: reduce)', s:'gear', h:['The machine asked you to calm it.','Less motion, same meaning.','Find the switch that quiets animations.']},
    {u:[16],    k:'mql-not', q:'(prefers-reduced-motion: reduce)', s:'comet', h:['The machine asked you to move again.','Motion isn’t forbidden here.','Let the spinner breathe.']},
    {u:[17],    k:'mql-any', q:['(prefers-contrast: more)','(forced-colors: active)'], s:'stripes', h:['Some people ask for sharper edges.','A forced palette may take over.','Contrast can be a setting, not a filter.']},
    {u:[18],    k:'mql-any', q:['(prefers-reduced-transparency: reduce)','(prefers-contrast: more)','(forced-colors: active)'], s:'glass', h:['Glass can be too much.','Make layers feel solid.','Ask the system to reduce translucence.']},
    {u:[19],    k:'mql-any', q:['(inverted-colors: inverted)','(forced-colors: active)'], s:'flip', h:['Opposites trade places.','A system can flip a palette.','Look for inversion beyond the page.']},
    {u:[20],    k:'reduced-data', s:'packets', h:['Packets want to travel lighter.','Spend less bandwidth.','A saver mode changes the rhythm.']},
    {u:[21],    k:'online', want:false, s:'antenna-down', h:['Silence the wires.','No network, no chatter.','Cut the signal for a moment.']},
    {u:[22],    k:'online', want:true,  s:'antenna-up',   h:['Signal returns.','Let the waves reach you again.','Restore the connection.']},
    {u:[23],    k:'visibility', s:'blink', h:['Blink.','Leave, then return.','Let the page become unseen briefly.']},
    {u:[24],    k:'wake', s:'candle', h:['Keep the screen awake.','A candle hates sleeping.','Borrow a lock from the device.']},
    {u:[25],    k:'tilt', axis:'gamma', cmp:'lt', v:-25, s:'marble', h:['Give the marble a slope.','Left has weight.','Tilt the world, not the square.']},
    {u:[26],    k:'tilt', axis:'gamma', cmp:'gt', v: 25, s:'bubble', h:['Balance shifts the other way.','Right has weight.','Let the bubble escape.']},
    {u:[27],    k:'tilt', axis:'beta',  cmp:'gt', v: 45, s:'hourglass', h:['The hourglass obeys gravity.','Face the ground.','Tip the world forward.']},
    {u:[28],    k:'shake', need:3, s:'snowglobe', h:['Shake the snow.','Wake the globe.','A few jolts will do.']},
    {u:[],      k:'ambient', lux:15, s:'lamp', h:['The lamp listens to the room.','Hide the light source.','Darkness, not brightness.']},
    {u:[],      k:'mic', lvl:0.55, s:'waveform', h:['Sound becomes shape.','Let the waves spike.','A small noise is enough.']},
    {u:[],      k:'camera', lvl:0.62, s:'iris', h:['The iris wants a scene.','Open an eye.','Show it light.']},
    {u:[],      k:'geo', s:'radar', h:['A pin on a map.','Ask where you are.','Let the radar find a dot.']},
    {u:[],      k:'clipboard', s:'paper', h:['A ghost of text can move without moving.','Borrow the clipboard.','Carry a mark outside the page.']},
    {u:[],      k:'share', s:'nodes', h:['A node wants to split.','Pass the fragment forward.','Invoke the native bridge.']},
    {u:[29],    k:'notify', s:'bell', h:['A bell must be allowed.','Permission is the puzzle.','Let the system speak for the page.']},
    {u:[],      k:'gamepad', s:'pad', h:['A controller changes the rhythm.','Bring another input to the ritual.','A new device joins the page.']}
  ];

  // Condition handlers (kept compact; unsupported/errored paths auto-complete to avoid dead-ends)
  const H = {
    mql: {
      supports: ()=>!!window.matchMedia,
      setup: (ctx,l)=>{ ctx.mql=mm(l.q); },
      test: (ctx)=>!!ctx.mql && ctx.mql.matches
    },
    'mql-not':{
      supports: ()=>!!window.matchMedia,
      setup:(ctx,l)=>{ ctx.mql=mm(l.q); },
      test:(ctx)=>!!ctx.mql && !ctx.mql.matches
    },
    'mql-any':{
      supports: ()=>!!window.matchMedia,
      setup:(ctx,l)=>{ ctx.mqls=(l.q||[]).map(mm); },
      test:(ctx)=> (ctx.mqls||[]).some(x=>x.matches)
    },
    flips:{
      supports: ()=>true,
      setup:(ctx,l)=>{
        ctx.flips=0; ctx.last=0;
        const bump=()=>{
          const now=performance.now();
          if(now-ctx.last>(l.win||1100)) ctx.flips=0;
          ctx.last=now; ctx.flips++;
          // visual ripple
          const r=document.createElement('div');
          r.style.cssText=`position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:999px;border:2px solid var(--accent);opacity:.38;transform:translate(-50%,-50%);`;
          sceneEl.appendChild(r);
          r.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:.38},{transform:'translate(-50%,-50%) scale(14)',opacity:0}],
                    {duration:650,easing:'cubic-bezier(.2,.9,.2,1)',fill:'forwards'});
          setTimeout(()=>r.remove(),720);
        };
        window.addEventListener('orientationchange', bump, {passive:true});
        window.addEventListener('resize', bump, {passive:true});
        ctx.cleanups.push(()=>{window.removeEventListener('orientationchange', bump); window.removeEventListener('resize', bump);});
      },
      test:(ctx,l)=> (ctx.flips||0) >= (l.need||2)
    },
    pinch:{
      supports: ()=> !!window.visualViewport && typeof window.visualViewport.scale==='number',
      setup:(ctx)=>{ ctx.vv=window.visualViewport; ctx.meter=0; },
      tick:(ctx,l)=>{
        const s=ctx.vv.scale||1;
        ctx.meter=clamp((s-1)/0.65,0,1);
      },
      test:(ctx)=> (ctx.meter||0) > 0.24
    },
    keyboard:{
      supports: ()=> !!window.visualViewport,
      setup:(ctx)=>{
        ctx.vv=window.visualViewport; ctx.baseH=ctx.vv.height||0; ctx.kb=0;
        const onR=()=>{ if(document.activeElement!==ctx._in) ctx.baseH=Math.max(ctx.baseH, ctx.vv.height||0); };
        ctx.vv.addEventListener?.('resize', onR);
        window.addEventListener('resize', onR, {passive:true});
        ctx.cleanups.push(()=>{ ctx.vv.removeEventListener?.('resize', onR); window.removeEventListener('resize', onR); });
      },
      tick:(ctx)=>{
        const h=ctx.vv.height||0;
        const d=Math.max(0,(ctx.baseH||h)-h);
        ctx.kb=clamp(d/280,0,1);
      },
      test:(ctx,l)=> (ctx.kb||0) > (l.th||0.35)
    },
    fullscreen:{
      supports: ()=> !!document.documentElement.requestFullscreen,
      onInteract: async (ctx)=>{
        try{ if(!document.fullscreenElement) await overlayInner.requestFullscreen?.(); }catch{ ctx._fail=true; }
      },
      test: ()=> !!document.fullscreenElement
    },
    online:{
      supports: ()=> typeof navigator.onLine === 'boolean',
      test:(ctx,l)=> navigator.onLine === !!l.want
    },
    visibility:{
      supports: ()=> typeof document.visibilityState === 'string',
      setup:(ctx)=>{
        ctx.hiddenOnce=false;
        const onV=()=>{ if(document.visibilityState==='hidden') ctx.hiddenOnce=true; };
        document.addEventListener('visibilitychange', onV);
        ctx.cleanups.push(()=>document.removeEventListener('visibilitychange', onV));
      },
      test:(ctx)=> ctx.hiddenOnce && document.visibilityState==='visible'
    },
    wake:{
      supports: ()=> !!(navigator.wakeLock && navigator.wakeLock.request),
      setup:(ctx)=>{ ctx.wakeOn=false; ctx.sentinel=null; },
      onInteract: async (ctx)=>{
        try{
          ctx.sentinel = await navigator.wakeLock.request('screen');
          ctx.wakeOn=true;
          ctx.cleanups.push(()=>{ try{ ctx.sentinel?.release?.(); }catch{} });
        }catch{ ctx._fail=true; }
      },
      test:(ctx)=> !!ctx.wakeOn
    },
    tilt:{
      supports: ()=> typeof window.DeviceOrientationEvent !== 'undefined',
      setup:(ctx)=>{ ctx.axisVal=null; ctx.ready=false; ctx.tilt01=0; },
      onInteract: async (ctx)=>{
        try{
          if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
            const st=await DeviceOrientationEvent.requestPermission();
            if(st!=='granted') throw new Error('denied');
          }
          const onDO=(e)=>{
            const v=(typeof e[active.level.axis]==='number') ? e[active.level.axis] : null;
            ctx.axisVal=v; ctx.ready=true;
            if(typeof v==='number') ctx.tilt01 = clamp(v/45,-1,1);
          };
          window.addEventListener('deviceorientation', onDO, {passive:true});
          ctx.cleanups.push(()=>window.removeEventListener('deviceorientation', onDO));
        }catch{ ctx._fail=true; }
      },
      test:(ctx,l)=>{
        if(typeof ctx.axisVal!=='number') return false;
        return (l.cmp==='lt') ? (ctx.axisVal < l.v) : (ctx.axisVal > l.v);
      }
    },
    shake:{
      supports: ()=> typeof window.DeviceMotionEvent !== 'undefined',
      setup:(ctx)=>{ ctx.shakes=0; ctx.last=0; ctx.ready=false; },
      onInteract: async (ctx)=>{
        try{
          if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
            const st=await DeviceMotionEvent.requestPermission();
            if(st!=='granted') throw new Error('denied');
          }
          const onDM=(e)=>{
            ctx.ready=true;
            const a=e.accelerationIncludingGravity || e.acceleration;
            if(!a) return;
            const mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
            const now=performance.now();
            if(mag>18 && now-ctx.last>320){ ctx.last=now; ctx.shakes++; }
          };
          window.addEventListener('devicemotion', onDM, {passive:true});
          ctx.cleanups.push(()=>window.removeEventListener('devicemotion', onDM));
        }catch{ ctx._fail=true; }
      },
      test:(ctx,l)=> (ctx.shakes||0) >= (l.need||3)
    },
    ambient:{
      supports: ()=> typeof window.AmbientLightSensor !== 'undefined',
      setup:(ctx)=>{ ctx.lux=null; ctx.ready=false; ctx.sensor=null; },
      onInteract: async (ctx)=>{
        try{
          const s=new AmbientLightSensor();
          ctx.sensor=s;
          s.addEventListener('reading', ()=>{ ctx.lux=s.illuminance; ctx.ready=true; });
          s.start();
          ctx.cleanups.push(()=>{ try{s.stop();}catch{} });
        }catch{ ctx._fail=true; }
      },
      test:(ctx,l)=> typeof ctx.lux==='number' && ctx.lux < (l.lux||15)
    },
    mic:{
      supports: ()=> !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
      setup:(ctx)=>{ ctx.micLevel=0; ctx.ready=false; ctx._an=null; ctx._buf=null; },
      onInteract: async (ctx)=>{
        try{
          const stream=await navigator.mediaDevices.getUserMedia({audio:true, video:false});
          ctx.ready=true;
          ctx.cleanups.push(()=>{ try{stream.getTracks().forEach(t=>t.stop());}catch{} });
          const AC=window.AudioContext||window.webkitAudioContext;
          const ac=new AC(); ctx.cleanups.push(()=>{ try{ac.close();}catch{} });
          const src=ac.createMediaStreamSource(stream);
          const an=ac.createAnalyser(); an.fftSize=1024; src.connect(an);
          ctx._an=an; ctx._buf=new Uint8Array(an.fftSize);
        }catch{ ctx._fail=true; }
      },
      tick:(ctx)=>{
        if(!ctx._an || !ctx._buf) return;
        ctx._an.getByteTimeDomainData(ctx._buf);
        let sum=0;
        for(let i=0;i<ctx._buf.length;i++){ const v=(ctx._buf[i]-128)/128; sum+=v*v; }
        const rms=Math.sqrt(sum/ctx._buf.length);
        ctx.micLevel=clamp(rms*3.2,0,1);
      },
      test:(ctx,l)=> (ctx.micLevel||0) > (l.lvl||0.55)
    },
    camera:{
      supports: ()=> !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
      setup:(ctx)=>{ ctx.camLevel=0; ctx.ready=false; ctx._v=null; ctx._c=null; ctx._t=0; },
      onInteract: async (ctx)=>{
        try{
          const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
          ctx.ready=true;
          ctx.cleanups.push(()=>{ try{stream.getTracks().forEach(t=>t.stop());}catch{} });
          const v=document.createElement('video'); v.playsInline=true; v.muted=true; v.srcObject=stream;
          await v.play(); ctx._v=v;
          const c=document.createElement('canvas'); c.width=64; c.height=64; ctx._c=c;
        }catch{ ctx._fail=true; }
      },
      tick:(ctx,t)=>{
        if(!ctx._v||!ctx._c) return;
        if(t-ctx._t<90) return; ctx._t=t;
        try{
          const g=ctx._c.getContext('2d',{willReadFrequently:true});
          g.drawImage(ctx._v,0,0,ctx._c.width,ctx._c.height);
          const d=g.getImageData(0,0,ctx._c.width,ctx._c.height).data;
          let sum=0;
          for(let i=0;i<d.length;i+=4){ sum += (0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]); }
          const avg=sum/(d.length/4);
          ctx.camLevel=clamp(avg/255,0,1);
        }catch{}
      },
      test:(ctx,l)=> (ctx.camLevel||0) > (l.lvl||0.62)
    },
    geo:{
      supports: ()=> !!navigator.geolocation,
      setup:(ctx)=>{ ctx.geoOk=false; ctx.ready=false; },
      onInteract:(ctx)=>{
        try{
          navigator.geolocation.getCurrentPosition(
            ()=>{ ctx.geoOk=true; ctx.ready=true; },
            ()=>{ ctx._fail=true; },
            {enableHighAccuracy:false,timeout:5000,maximumAge:60000}
          );
        }catch{ ctx._fail=true; }
      },
      test:(ctx)=> !!ctx.geoOk
    },
    clipboard:{
      supports: ()=> !!(navigator.clipboard && navigator.clipboard.writeText),
      setup:(ctx)=>{ ctx.ok=false; },
      onInteract: async (ctx)=>{
        try{ await navigator.clipboard.writeText('⬛︎'); ctx.ok=true; }catch{ ctx._fail=true; }
      },
      test:(ctx)=> !!ctx.ok
    },
    share:{
      supports: ()=> !!navigator.share,
      setup:(ctx)=>{ ctx.ok=false; },
      onInteract: async (ctx)=>{
        try{ await navigator.share({text:'⬛︎'}); ctx.ok=true; }catch{/* user cancel is common; don't force fail */ }
      },
      test:(ctx)=> !!ctx.ok
    },
    notify:{
      supports: ()=> typeof Notification!=='undefined' && !!Notification.requestPermission,
      setup:(ctx)=>{ ctx.ok=(typeof Notification!=='undefined' && Notification.permission==='granted'); },
      onInteract: async (ctx)=>{
        try{
          const r=await Notification.requestPermission();
          ctx.ok = (r==='granted') || (Notification.permission==='granted');
        }catch{ ctx._fail=true; }
      },
      test:(ctx)=> !!ctx.ok
    },
    gamepad:{
      supports: ()=> !!navigator.getGamepads,
      setup:(ctx)=>{ ctx.pad=false; },
      tick:(ctx)=>{
        try{
          const pads=navigator.getGamepads?.()||[];
          ctx.pad=pads.some(p=>p);
        }catch{}
      },
      test:(ctx)=> !!ctx.pad
    },
    'reduced-data':{
      supports: ()=> !!window.matchMedia,
      setup:(ctx)=>{ ctx.mql=mm('(prefers-reduced-data: reduce)'); ctx.conn=navigator.connection||null; },
      test:(ctx)=> (ctx.mql && ctx.mql.matches) || (ctx.conn && ctx.conn.saveData===true)
    }
  };

  // Scene renderers (compact, color-led, animated hints). Each sets ctx.visualTick if needed.
  function sceneRender(level, ctx){
    const A='var(--accent)';
    clear(sceneEl);

    // Ambient particle field: unique per level, still subtle
    for(let i=0;i<10;i++){
      const d=document.createElement('div');
      d.style.cssText=`position:absolute;left:${rand(6,94)}%;top:${rand(10,92)}%;width:${rand(2,6)}px;height:${rand(2,6)}px;border-radius:99px;background:${A};opacity:${rand(.06,.18)};`;
      sceneEl.appendChild(d);
      ctx.anims.push(d.animate([{transform:'translateY(0px)'},{transform:`translateY(${rand(-18,18)}px)`}],
        {duration:rand(1800,3200),iterations:Infinity,direction:'alternate',easing:'ease-in-out'}));
    }

    const mk=(cssText)=>{ const x=document.createElement('div'); x.style.cssText=cssText; sceneEl.appendChild(x); return x; };

    switch(level.s){
      case 'horizon': {
        const line=mk(`position:absolute;left:-18%;right:-18%;top:54%;height:6px;border-radius:999px;background:${A};opacity:.55;transform:skewX(-12deg);`);
        ctx.anims.push(line.animate([{transform:'translateX(-14px) skewX(-12deg)'},{transform:'translateX(14px) skewX(-12deg)'}],
          {duration:1800,iterations:Infinity,direction:'alternate',easing:'ease-in-out'}));
        const sq=mk(`position:absolute;left:50%;top:50%;width:46%;height:46%;border:6px solid ${A};border-radius:22px;opacity:.9;transform:translate(-50%,-50%) rotate(0deg);`);
        ctx.anims.push(sq.animate([{transform:'translate(-50%,-50%) rotate(0deg)'},{transform:'translate(-50%,-50%) rotate(90deg)'}],
          {duration:2600,iterations:Infinity,direction:'alternate',easing:'cubic-bezier(.2,.9,.2,1)'}));
      } break;

      case 'rain': {
        mk(`position:absolute;left:50%;top:50%;width:18%;height:92%;transform:translate(-50%,-50%);border-radius:999px;border:2px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.05));`);
        for(let i=0;i<14;i++){
          const drop=mk(`position:absolute;left:${rand(35,65)}%;top:${rand(-30,20)}%;width:${rand(6,14)}px;height:${rand(10,22)}px;border-radius:999px;background:${A};opacity:${rand(.12,.32)};filter:blur(.2px);transform:translate(-50%,-120px);`);
          ctx.anims.push(drop.animate([{transform:'translate(-50%,-120px)',opacity:drop.style.opacity},{transform:`translate(-50%,${rand(520,780)}px)`,opacity:0}],
            {duration:rand(900,1800),iterations:Infinity,delay:rand(0,900),easing:'cubic-bezier(.1,.9,.2,1)'}));
        }
      } break;

      case 'pendulum': {
        const rod=mk(`position:absolute;left:50%;top:28%;width:6px;height:44%;border-radius:99px;background:linear-gradient(180deg,${A},rgba(255,255,255,0));opacity:.45;transform-origin:50% 0%;transform:translateX(-50%) rotate(0deg);`);
        const w=document.createElement('div');
        w.style.cssText=`position:absolute;left:50%;top:92%;width:48px;height:48px;border-radius:999px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),${A};opacity:.22;transform:translate(-50%,-50%);`;
        rod.appendChild(w);
        ctx.anims.push(rod.animate([{transform:'translateX(-50%) rotate(-26deg)'},{transform:'translateX(-50%) rotate(26deg)'}],
          {duration:1200,iterations:Infinity,direction:'alternate',easing:'cubic-bezier(.4,0,.2,1)'}));
        sceneEl.appendChild(rod);
      } break;

      case 'tank': {
        const tank=mk(`position:absolute;left:50%;top:50%;width:78%;height:78%;transform:translate(-50%,-50%);border-radius:24px;border:2px solid rgba(255,255,255,.11);box-shadow:0 20px 80px rgba(0,0,0,.35) inset;overflow:hidden;`);
        const liquid=document.createElement('div');
        liquid.style.cssText=`position:absolute;left:0;right:0;bottom:0;height:120%;transform:translateY(100%);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 22%),${A};opacity:.22;border-radius:22px;`;
        tank.appendChild(liquid);
        ctx.visualTick=()=>{ liquid.style.transform=`translateY(${(1-(ctx.meter||0))*100}%)`; };
        sceneEl.appendChild(tank);
      } break;

      case 'cursor': {
        const field=mk(`position:absolute;left:50%;top:34%;width:80%;height:86px;transform:translate(-50%,-50%);border-radius:22px;border:2px solid rgba(255,255,255,.12);background:rgba(0,0,0,.22);box-shadow:0 12px 40px rgba(0,0,0,.35) inset;`);
        const cur=document.createElement('div');
        cur.style.cssText=`position:absolute;left:22%;top:28%;width:4px;height:44%;border-radius:99px;background:${A};opacity:.55;`;

        ctx.anims.push(cur.animate([{opacity:.15},{opacity:.65}],{duration:560,iterations:Infinity,direction:'alternate',easing:'steps(2,end)'}));

        sceneEl.appendChild(input);
        ctx._in=input;
        field.addEventListener('pointerdown', ()=>{ try{ input.focus({preventScroll:true}); }catch{} });
        const kb=mk(`position:absolute;left:0;right:0;bottom:0;height:44%;transform:translateY(100%);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 35%),${A};opacity:.16;`);

      case 'frame': {
        mk(`position:absolute;left:50%;top:50%;width:78%;height:78%;transform:translate(-50%,-50%);border-radius:26px;border:2px solid rgba(255,255,255,.14);box-shadow:0 0 0 2px rgba(255,255,255,.06) inset;`);
        const edge=mk(`position:absolute;inset:10%;border-radius:26px;box-shadow:0 0 0 3px ${A} inset;opacity:.18;`);
        const anim=edge.animate([{transform:'scale(0.92)',opacity:.12},{transform:'scale(1.08)',opacity:.22}],
          {duration:1300,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});
        ctx.anims.push(anim);
        ctx.visualTick=()=>{ anim.playbackRate = document.fullscreenElement ? 0.15 : 1; };

      case 'eclipse': {
        const orb=mk(`position:absolute;left:50%;top:46%;width:160px;height:160px;border-radius:999px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.12),rgba(255,255,255,0) 60%),${A};opacity:.20;transform:translate(-50%,-50%);`);
        const bite=mk(`position:absolute;left:56%;top:38%;width:160px;height:160px;border-radius:999px;background:rgba(0,0,0,.85);filter:blur(.2px);transform:translate(-50%,-50%);opacity:1;`);
        ctx.anims.push(bite.animate([{transform:'translate(-50%,-50%) translateX(10px)'},{transform:'translate(-50%,-50%) translateX(-8px)'}],
          {duration:2200,iterations:Infinity,direction:'alternate',easing:'ease-in-out'}));
      } break;

      case 'sun': {
        const sun=mk(`position:absolute;left:50%;top:46%;width:130px;height:130px;border-radius:999px;background:${A};opacity:.22;transform:translate(-50%,-50%);box-shadow:0 0 0 18px rgba(255,255,255,.03);`);
        const rays=mk(`position:absolute;left:50%;top:46%;width:260px;height:260px;transform:translate(-50%,-50%);`);
        for(let i=0;i<12;i++){
          const r=document.createElement('div');
          r.style.cssText=`position:absolute;left:50%;top:50%;width:6px;height:42px;border-radius:99px;background:${A};opacity:.14;transform:translate(-50%,-50%) rotate(${i*30}deg) translateY(-108px);`;
          rays.appendChild(r);
          ctx.anims.push(r.animate([{opacity:.06},{opacity:.18}],{duration:rand(700,1200),iterations:Infinity,direction:'alternate',easing:'ease-in-out',delay:rand(0,900)}));
        }
        sceneEl.appendChild(rays);
        ctx.anims.push(rays.animate([{transform:'translate(-50%,-50%) rotate(-6deg)'},{transform:'translate(-50%,-50%) rotate(6deg)'}],
          {duration:2400,iterations:Infinity,direction:'alternate',easing:'ease-in-out'}));
      } break;

      case 'gear': {
        const wheel=mk(`position:absolute;left:50%;top:50%;width:190px;height:190px;border-radius:999px;border:10px solid rgba(255,255,255,.06);box-shadow:0 0 0 4px rgba(255,255,255,.05) inset;transform:translate(-50%,-50%) rotate(0deg);`);
        for(let i=0;i<8;i++){
          const s=document.createElement('div');
          s.style.cssText=`position:absolute;left:50%;top:50%;width:6px;height:54%;border-radius:99px;background:${A};opacity:.14;transform:translate(-50%,-50%) rotate(${i*45}deg) translateY(-34px);`;
          wheel.appendChild(s);
        }
        const a=wheel.animate([{transform:'translate(-50%,-50%) rotate(0deg)'},{transform:'translate(-50%,-50%) rotate(360deg)'}],{duration:1100,iterations:Infinity,easing:'linear'});
        ctx.anims.push(a);
        ctx.visualTick=()=>{ a.playbackRate = mm('(prefers-reduced-motion: reduce)').matches ? 0 : 1; };
      } break;

      case 'comet': {
        const c=mk(`position:absolute;left:14%;top:62%;width:18px;height:18px;border-radius:999px;background:${A};opacity:.35;`);
        const t=document.createElement('div');
        t.style.cssText=`position:absolute;left:-220px;top:50%;width:220px;height:4px;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,0),${A});opacity:.22;transform:translateY(-50%);`;
        c.appendChild(t);
        const a=c.animate([{transform:'translate(0,0)'},{transform:'translate(760px,-180px)'},{transform:'translate(1180px,25px)'}],
          {duration:1600,iterations:Infinity,direction:'alternate',easing:'cubic-bezier(.2,.8,.2,1)'});
        ctx.anims.push(a);
        ctx.visualTick=()=>{ a.playbackRate = mm('(prefers-reduced-motion: reduce)').matches ? 0 : 1; };
      } break;

      case 'stripes': {
        const s=mk(`position:absolute;inset:-20%;opacity:.22;transform:rotate(-12deg);`);
        for(let i=0;i<18;i++){
          const bar=document.createElement('div');
          bar.style.cssText=`position:absolute;left:${i*8}%;top:0;width:4%;height:140%;background:${A};opacity:${(i%2)?0.12:0.22};filter:blur(.2px);`;
          s.appendChild(bar);
        }
        sceneEl.appendChild(s);
        ctx.anims.push(s.animate([{transform:'rotate(-12deg) translateX(-18px)'},{transform:'rotate(-12deg) translateX(18px)'}],
          {duration:1200,iterations:Infinity,direction:'alternate',easing:'ease-in-out'}));
      } break;

      case 'glass': {
        const p=(l,t,w,h,op)=>mk(`position:absolute;left:${l};top:${t};width:${w};height:${h};border-radius:22px;border:2px solid rgba(255,255,255,.10);background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,0));box-shadow:0 24px 60px rgba(0,0,0,.35);opacity:${op};`);
        const p1=p('6%','10%','52%','36%','.40'), p2=p('42%','34%','52%','38%','.40'), p3=p('10%','58%','44%','30%','.40');
        ctx.visualTick=()=>{
          const solid = mm('(prefers-reduced-transparency: reduce)').matches || mm('(prefers-contrast: more)').matches || mm('(forced-colors: active)').matches;
          const o = solid ? .88 : .40;
          p1.style.opacity=p2.style.opacity=p3.style.opacity=String(o);
        };
      } break;

      case 'flip': {
        const a=mk(`position:absolute;inset:12%;border-radius:26px;background:${A};opacity:.10;`);

        ctx.visualTick=()=>{
          const on = mm('(inverted-colors: inverted)').matches || mm('(forced-colors: active)').matches;

      case 'packets': {
        mk(`position:absolute;left:10%;right:10%;top:50%;height:10px;border-radius:999px;background:rgba(255,255,255,.06);transform:translateY(-50%);`);

        const pkts=[];

          const p=document.createElement('div');
          p.style.cssText=`position:absolute;left:${rand(-10,90)}%;top:${rand(30,70)}%;width:${rand(6,12)}px;height:${rand(6,12)}px;border-radius:6px;background:${A};opacity:${rand(.12,.26)};`;
          wrap.appendChild(p);
          pkts.push(p);
          ctx.anims.push(p.animate([{transform:'translateX(-40px)'},{transform:'translateX(520px)'}],
            {duration:rand(900,1700),iterations:Infinity,delay:rand(0,800),easing:'linear'}));
        }
        sceneEl.appendChild(wrap);
        ctx.visualTick=()=>{
          const saver = mm('(prefers-reduced-data: reduce)').matches || ((navigator.connection||{}).saveData===true);
          const n = saver ? 4 : 10;
          for(let i=0;i<pkts.length;i++) pkts[i].style.opacity = (i<n) ? (saver?'.26':'.20') : '.05';

      case 'antenna-down':

        mk(`position:absolute;left:50%;top:56%;width:8px;height:45%;background:${A};opacity:.20;border-radius:99px;transform:translate(-50%,-50%);`);
        for(let i=0;i<3;i++){
          const s=120+i*70;

          ctx.anims.push(w.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:.16},{transform:'translate(-50%,-50%) scale(1.3)',opacity:0}],
            {duration:1200+i*260,iterations:Infinity,delay:i*140,easing:'cubic-bezier(.2,.9,.2,1)'}));
        }
        ctx.visualTick=()=>{
          const good = level.s==='antenna-up' ? (navigator.onLine===true) : (navigator.onLine===false);
          sceneEl.style.opacity = good ? '1' : '.92';
        };
      } break;

      case 'blink': {
        const top=mk(`position:absolute;left:0;right:0;top:0;height:50%;background:rgba(0,0,0,.88);transform:translateY(-60%);border-bottom:2px solid rgba(255,255,255,.06);`);
        const bot=mk(`position:absolute;left:0;right:0;bottom:0;height:50%;background:rgba(0,0,0,.88);transform:translateY(60%);border-top:2px solid rgba(255,255,255,.06);`);
        mk(`position:absolute;left:50%;top:50%;width:240px;height:140px;transform:translate(-50%,-50%);border-radius:999px;border:2px solid rgba(255,255,255,.10);`);
        ctx.visualTick=(t)=>{
          const amt=(Math.sin(t/650)+1)/2, y=18*amt;
          top.style.transform=`translateY(calc(-60% + ${y}px))`;
          bot.style.transform=`translateY(calc(60% - ${y}px))`;
        };
      } break;

      case 'candle': {
        mk(`position:absolute;left:50%;top:62%;width:90px;height:160px;transform:translate(-50%,-50%);border-radius:22px;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08);`);
        const flame=mk(`position:absolute;left:50%;top:34%;width:70px;height:90px;transform:translate(-50%,-50%) rotate(0deg);border-radius:90px 90px 90px 90px / 120px 120px 60px 60px;background:${A};opacity:.18;`);
        const a=flame.animate([{transform:'translate(-50%,-50%) rotate(-6deg) scale(.96)',opacity:.14},{transform:'translate(-50%,-50%) rotate(6deg) scale(1.06)',opacity:.22}],
          {duration:320,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});
        ctx.anims.push(a);
        ctx.visualTick=()=>{ a.playbackRate = ctx.wakeOn ? 0.15 : 1; };
      } break;

      case 'marble': {
        mk(`position:absolute;left:50%;top:60%;width:78%;height:18px;transform:translate(-50%,-50%) rotate(-10deg);border-radius:999px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.08);`);
        const m=mk(`position:absolute;left:50%;top:60%;width:26px;height:26px;border-radius:999px;background:${A};opacity:.22;transform:translate(-50%,-50%);box-shadow:0 14px 30px rgba(0,0,0,.35);`);
        ctx.visualTick=()=>{ const x=clamp((ctx.tilt01||0)*160,-160,160); m.style.transform=`translate(-50%,-50%) translateX(${x}px)`; };
      } break;

      case 'bubble': {
        mk(`position:absolute;left:50%;top:52%;width:78%;height:60px;transform:translate(-50%,-50%);border-radius:999px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02);`);
        const b=mk(`position:absolute;left:50%;top:52%;width:42px;height:42px;border-radius:999px;border:4px solid ${A};opacity:.22;transform:translate(-50%,-50%);`);
        ctx.visualTick=()=>{ const x=clamp((ctx.tilt01||0)*220,-220,220); b.style.transform=`translate(-50%,-50%) translateX(${x}px)`; };
      } break;

      case 'hourglass': {
        const g=mk(`position:absolute;left:50%;top:50%;width:200px;height:280px;transform:translate(-50%,-50%);border-radius:30px;border:2px solid rgba(255,255,255,.12);overflow:hidden;`);
        const top=mk(`position:absolute;left:50%;top:50%;width:200px;height:280px;transform:translate(-50%,-50%);`);
        const sandT=document.createElement('div');
        sandT.style.cssText=`position:absolute;left:0;right:0;top:0;height:50%;background:${A};opacity:.16;`;
        const sandB=document.createElement('div');
        sandB.style.cssText=`position:absolute;left:0;right:0;bottom:0;height:50%;background:${A};opacity:.10;`;
        g.appendChild(sandT); g.appendChild(sandB);
        ctx.visualTick=()=>{ const b=clamp((ctx.tilt01||0)/2+0.5,0,1); sandT.style.height=`${50*(1-b)}%`; sandB.style.height=`${50*b}%`; };
        sceneEl.appendChild(g);
      } break;

      case 'snowglobe': {
        mk(`position:absolute;left:50%;top:46%;width:240px;height:240px;transform:translate(-50%,-50%);border-radius:999px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02);overflow:hidden;`);
        mk(`position:absolute;left:50%;top:78%;width:260px;height:70px;transform:translate(-50%,-50%);border-radius:22px;background:rgba(255,255,255,.03);border:2px solid rgba(255,255,255,.08);`);
        ctx.visualTick=()=>{
          // when shakes increment, toss a few flakes (hint feedback)
          if(!ctx._flakes){ ctx._flakes=0; }
          if((ctx.shakes||0)>ctx._flakes){
            ctx._flakes=ctx.shakes;
            for(let i=0;i<10;i++){
              const f=document.createElement('div');
              f.style.cssText=`position:absolute;left:${rand(15,85)}%;top:${rand(20,70)}%;width:${rand(3,6)}px;height:${rand(3,6)}px;border-radius:99px;background:${A};opacity:${rand(.10,.22)};`;
              sceneEl.appendChild(f);
              f.animate([{transform:'translate(0,0)'},{transform:`translate(${rand(-40,40)}px,${rand(-60,60)}px)`}],
                        {duration:rand(600,900),easing:'cubic-bezier(.2,.9,.2,1)',fill:'forwards'});
              setTimeout(()=>f.remove(),900);
            }
          }
        };
      } break;

      case 'lamp': {
        mk(`position:absolute;left:50%;top:42%;width:180px;height:180px;transform:translate(-50%,-50%);border-radius:999px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02);`);
        const glow=mk(`position:absolute;left:50%;top:42%;width:260px;height:260px;transform:translate(-50%,-50%);border-radius:999px;background:${A};opacity:.10;filter:blur(26px);`);
        ctx.visualTick=()=>{
          const lux=(typeof ctx.lux==='number')?ctx.lux:100;
          const darkness=clamp(1-(lux/120),0,1);
          glow.style.opacity=String(0.06+darkness*0.22);
        };
      } break;

      case 'waveform': {
        const base=mk(`position:absolute;left:50%;top:64%;width:80%;height:140px;transform:translate(-50%,-50%);border-radius:26px;border:2px solid rgba(255,255,255,.10);background:rgba(255,255,255,.02);display:flex;gap:10px;align-items:flex-end;justify-content:center;padding:18px;`);
        const bars=[];
        for(let i=0;i<12;i++){
          const b=document.createElement('div');
          b.style.cssText=`width:10px;height:${rand(18,60)}px;border-radius:99px;background:${A};opacity:.12;`;
          base.appendChild(b);
          bars.push(b);
        }
        ctx.visualTick=()=>{
          const lvl=ctx.micLevel||0;
          for(let i=0;i<bars.length;i++){
            const h=12+(i%3)*6+lvl*(110+(i%5)*10);
            bars[i].style.height=`${h}px`;
            bars[i].style.opacity=String(0.10+lvl*0.40);
          }
        };
      } break;

      case 'iris': {
        mk(`position:absolute;left:50%;top:50%;width:260px;height:260px;transform:translate(-50%,-50%);border-radius:999px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02);`);
        const ap=mk(`position:absolute;left:50%;top:50%;width:200px;height:200px;transform:translate(-50%,-50%) scale(.55);border-radius:28px;border:2px solid ${A};opacity:.10;`);
        for(let i=0;i<6;i++){
          const blade=document.createElement('div');
          blade.style.cssText=`position:absolute;left:50%;top:50%;width:8px;height:80px;border-radius:99px;background:${A};opacity:.10;transform:translate(-50%,-50%) rotate(${i*60}deg) translateY(-28px);`;
          ap.appendChild(blade);
        }
        ctx.visualTick=()=>{
          const open=clamp(((ctx.camLevel||0)-0.1)/0.7,0,1);
          ap.style.transform=`translate(-50%,-50%) scale(${0.55+open*0.65}) rotate(${open*30}deg)`;
          ap.style.opacity=String(0.10+open*0.38);
        };
      } break;

      case 'radar': {
        const r=mk(`position:absolute;left:50%;top:54%;width:280px;height:280px;transform:translate(-50%,-50%);border-radius:999px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02);overflow:hidden;`);
        for(let i=1;i<=3;i++){
          const ring=document.createElement('div');
          ring.style.cssText=`position:absolute;left:50%;top:50%;width:${i*26}%;height:${i*26}%;transform:translate(-50%,-50%);border-radius:999px;border:2px solid ${A};opacity:.10;`;
          r.appendChild(ring);
        }
        const sweep=document.createElement('div');
        sweep.style.cssText=`position:absolute;left:50%;top:50%;width:50%;height:50%;transform-origin:0% 0%;background:linear-gradient(90deg,rgba(255,255,255,0),${A});opacity:.14;transform:translate(0,0) rotate(0deg);`;
        r.appendChild(sweep);
        ctx.anims.push(sweep.animate([{transform:'translate(0,0) rotate(0deg)'},{transform:'translate(0,0) rotate(360deg)'}],
          {duration:1600,iterations:Infinity,easing:'linear'}));
        sceneEl.appendChild(r);
        ctx.visualTick=()=>{
          r.style.opacity = (ctx.geoOk||false) ? '1' : '.95';
        };
      } break;

      case 'paper': {
        mk(`position:absolute;left:50%;top:42%;width:180px;height:220px;transform:translate(-50%,-50%);border-radius:22px;border:2px solid rgba(255,255,255,.12);background:rgba(0,0,0,.22);`);
        const stamp=mk(`position:absolute;left:50%;top:58%;width:64px;height:64px;transform:translate(-50%,-50%) rotate(0deg);border-radius:18px;border:3px solid ${A};opacity:.14;`);
        ctx.anims.push(stamp.animate([{transform:'translate(-50%,-50%) rotate(-8deg)'},{transform:'translate(-50%,-50%) rotate(8deg)'}],
          {duration:1200,iterations:Infinity,direction:'alternate',easing:'ease-in-out'}));
        ctx.visualTick=()=>{ stamp.style.opacity = (ctx.ok||false) ? '.50' : '.14'; };
      } break;

      case 'nodes': {
        const hub=mk(`position:absolute;left:50%;top:52%;width:18px;height:18px;border-radius:99px;background:${A};opacity:.26;transform:translate(-50%,-50%);`);
        const pos=[[-160,-70],[160,-70],[-110,140],[110,140]];
        const nodes=[];
        for(const [x,y] of pos){
          const n=mk(`position:absolute;left:50%;top:52%;width:14px;height:14px;border-radius:99px;background:${A};opacity:.14;transform:translate(-50%,-50%) translate(${x}px,${y}px);`);
          nodes.push(n);
          mk(`position:absolute;left:50%;top:52%;width:${Math.hypot(x,y)}px;height:2px;background:${A};opacity:.10;transform-origin:0 50%;transform:translate(-50%,-50%) rotate(${Math.atan2(y,x)}rad);`);
        }
        const pulse=mk(`position:absolute;left:50%;top:52%;width:18px;height:18px;border-radius:999px;border:2px solid ${A};opacity:.20;transform:translate(-50%,-50%);`);
        ctx.anims.push(pulse.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:.20},{transform:'translate(-50%,-50%) scale(14)',opacity:0}],
          {duration:1300,iterations:Infinity,easing:'cubic-bezier(.2,.9,.2,1)'}));
        ctx.visualTick=()=>{ const o=(ctx.ok||false)?'.34':'.14'; for(const n of nodes) n.style.opacity=o; };
      } break;

      case 'bell': {
        const bell=mk(`position:absolute;left:50%;top:46%;width:180px;height:180px;transform:translate(-50%,-50%);border-radius:40px 40px 999px 999px;border:2px solid rgba(255,255,255,.12);background:rgba(0,0,0,.22);overflow:hidden;`);
        mk(`position:absolute;left:50%;top:63%;width:70%;height:10px;transform:translateX(-50%);border-radius:99px;background:${A};opacity:.12;`);
        const a=bell.animate([{transform:'translate(-50%,-50%) rotate(-6deg)'},{transform:'translate(-50%,-50%) rotate(6deg)'}],
          {duration:820,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});
        ctx.anims.push(a);
        ctx.visualTick=()=>{ bell.style.opacity = (ctx.ok||false) ? '0.96' : '1'; };
      } break;

      case 'pad': {
        const pad=mk(`position:absolute;left:50%;top:54%;width:300px;height:170px;transform:translate(-50%,-50%);border-radius:70px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02);`);
        mk(`position:absolute;left:50%;top:54%;width:30%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),${A},rgba(255,255,255,0));opacity:.07;filter:blur(10px);transform:translateX(-40%);`);
        const scan=sceneEl.lastChild;
        ctx.anims.push(scan.animate([{transform:'translateX(-40%)'},{transform:'translateX(420%)'}],
          {duration:1500,iterations:Infinity,easing:'cubic-bezier(.2,.9,.2,1)'}));
        ctx.visualTick=()=>{ pad.style.opacity = (ctx.pad||false) ? '.95' : '1'; };
      } break;

      default: break;
    }
  }

  // Runtime
  let active=null, raf=0;

  function makeCtx(idx){
    return { idx, color: COLORS[idx], startedAt: performance.now(), anims: [], cleanups: [], visualTick: null };
  }

  function startLoop(){
    cancelAnimationFrame(raf);
    const loop=(t)=>{
      if(!active) return;
      const {ctx, level, handler} = active;

      // drive handler ticks
      if(handler.tick) { try{ handler.tick(ctx, level, t); }catch{} }
      if(ctx.visualTick) { try{ ctx.visualTick(t); }catch{} }

      // If a gesture-required API fails, do not trap.
      if(ctx._fail && !ctx._failHandled){
        ctx._failHandled=true;
        setTimeout(()=>{ if(active && active.ctx===ctx) complete(true); }, 200);
      }

      // test
      let ok=false;
      try{ ok=!!handler.test(ctx, level); }catch{}
      if(!ctx.completed && !ctx.unsupported && ok) complete(false);

      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
  }
  function stopLoop(){ cancelAnimationFrame(raf); raf=0; }

  function openLevel(idx){
    if(!state.unlocked.includes(idx)) return;
    if(active) closeLevel();

    const level = LEVELS[idx];
    const handler = H[level.k];
    const ctx = makeCtx(idx);

    active = { idx, level, handler, ctx };
    setAccent(ctx.color);

    overlay.hidden=false; overlay.setAttribute('aria-hidden','false');
    coreBtn.style.setProperty('--c', ctx.color);
    coreBtn.classList.toggle('is-done', !!state.completed[idx]);
    coreBtn.innerHTML = squareSVG();

    updateHintUI();
    clear(sceneEl);

    // render scene
    sceneRender(level, ctx);

    // setup handler
    try{ handler.setup && handler.setup(ctx, level); }catch{}

    // wire interactions: core is the only “action” target inside levels
    coreBtn.onclick = ()=>{ try{ handler.onInteract && handler.onInteract(ctx, level); }catch{ ctx._fail=true; } };
    backBtn.onclick = closeLevel;
    hintBtn.onclick = useHint;

    // unsupported? (avoid dead-ends in random HTML viewer environments)
    let supported=true;
    try{ supported = handler.supports ? !!handler.supports(ctx, level) : true; }catch{ supported=false; }
    if(!supported){
      ctx.unsupported=true;
      setTimeout(()=>{ if(active && active.idx===idx) complete(true); }, 900);
      return;
    }

    startLoop();
  }

  function closeLevel(){
    if(!active) return;
    stopLoop();

    try{ if(document.fullscreenElement) document.exitFullscreen?.(); }catch{}

    const ctx=active.ctx;
    for(const a of ctx.anims){ try{ a.cancel(); }catch{} }
    for(const fn of ctx.cleanups){ try{ fn(); }catch{} }

    active=null;
    overlay.hidden=true; overlay.setAttribute('aria-hidden','true');
    coreBtn.onclick=null; backBtn.onclick=null; hintBtn.onclick=null;
    toastEl.classList.remove('show');
    renderGrid();
  }

  function complete(fromUnsupported){
    if(!active) return;
    const {idx, level, ctx} = active;
    if(ctx.completed) return;
    ctx.completed=true;

    state.completed[idx]=true;
    for(const u of (level.u||[])) if(!state.unlocked.includes(u)) state.unlocked.push(u);
    save();

    try{ burst(ctx, fromUnsupported ? 10 : 22); }catch{}
    coreBtn.classList.add('is-done');

    setTimeout(closeLevel, fromUnsupported ? 700 : 900);
  }

  function useHint(){
    if(!active) return;
    if(state.hintsLeft<=0){ toast('…'); return; }
    const idx=active.idx;
    const used=(state.hinted[idx]||0);
    const hints=active.level.h||['…'];
    const msg=hints[Math.min(used, hints.length-1)];
    state.hintsLeft=clamp(state.hintsLeft-1,0,3);
    state.hinted[idx]=used+1;
    save(); updateHintUI(); toast(msg);
  }

  renderGrid();
})();
</script>
</body>
